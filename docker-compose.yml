services:
  fastapi:
    build:
      context: .
      dockerfile: docker/prod/deploy.Dockerfile
      target: fastapi
    container_name: ba_lead_engine_fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ba_network

  streamlit:
    build:
      context: .
      dockerfile: docker/prod/deploy.Dockerfile
      target: streamlit
    container_name: ba_lead_engine_streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://fastapi:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - ba_network

networks:
  ba_network:
    driver: bridge
