[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "british_airways_booking_predictor"
version = "0.1.0"
description = "ML system to predict British Airways customer bookings"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn>=0.42.0",
    "pydantic>=2.12.5",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "scikit-learn>=1.7.2",
    "xgboost>=3.2.0",
    "onnx>=1.20.1",
    "onnxruntime>=1.23.2",
    "skl2onnx>=1.20.0",
    "onnxmltools>=1.16.0",
    "onnxconverter-common>=1.16.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
]
ui = [
    "streamlit>=1.55.0",
    "plotly>=6.6.0",
    "requests>=2.33.0",
]
rag = [
    "groq>=0.30.0",
    "chromadb>=1.3.0",
    "sentence-transformers>=5.1.2",
    "pypdf>=6.1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]