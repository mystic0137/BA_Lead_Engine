services:
  fastapi:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
      target: fastapi
    container_name: ba_lead_engine_fastapi_dev
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./core:/app/core
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./models:/app/models
      - ./hf_models:/app/hf_models
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ba_network

  streamlit:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
      target: streamlit
    container_name: ba_lead_engine_streamlit_dev
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend
    environment:
      - API_URL=http://fastapi:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - ba_network

networks:
  ba_network:
    driver: bridge
